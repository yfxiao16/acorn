[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acorn"
version = "0.1.0"
description = "ACORN: Agent Contract Orchestration for Runtime Navigation — a neuro-symbolic agent harness"
license = { text = "MIT" }
authors = [{ name = "Yifeng Xiao" }]
requires-python = ">=3.10"
# contragent is a sibling-repo dependency, installed editable:
#   pip install -e ../ContrAgent
# It is deliberately not pinned here because it is not published to PyPI yet.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
include = ["acorn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
